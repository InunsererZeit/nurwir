<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네 개의 사물에 담아두는 이야기, In unserer Zeit">
  <title>In unserer Zeit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Playfair+Display:wght@400;500;600&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=engraving-1">
</head>
<body>
  <div class="intro-screen" id="intro-screen">
    <h1 class="intro-logo" aria-label="In unserer Zeit"><span aria-hidden="true">In</span><span aria-hidden="true">unserer</span><span aria-hidden="true">Zeit</span></h1>
  </div>
  <div class="page">
    <main aria-label="이야기가 담긴 네 개의 사물">
      <div class="collage" id="collage"></div>
    </main>
  </div>
  <dialog id="reading-window" aria-labelledby="window-title" aria-describedby="window-copy">
    <div class="window-bar"><span id="window-category">a little story</span><button class="close" id="close-window" type="button" aria-label="글 창 닫기">×</button></div>
    <div class="window-body"><h2 id="window-title" tabindex="-1"></h2><p class="copy" id="window-copy"></p><p class="sample">예시 글 · 나만의 이야기로 바꿔주세요.</p></div>
  </dialog>
  <template id="newspaper-template"><span class="newspaper" lang="de">
<span class="news-meta"><span>Großherzogthum Mecklenburg-Strelitz.</span><span>Frühjahr 1905.</span></span>
<span class="news-masthead">Neustrelitzer Zeitung</span>
<span class="news-rule">Nachrichten aus Stadt und Land.</span>
<span class="news-lead">Der Erbgroßherzog<br>im Carolinenstift.</span>
<span class="news-article">Seine Königliche Hoheit der Erbgroßherzog stattete gestern dem Carolinenstift einen Besuch ab. Unter Führung des leitenden Arztes besichtigte der hohe Gast die Krankensäle, die Küche und die Einrichtungen zur Pflege der Genesenden. Er erkundigte sich nach der Versorgung der Kranken und ließ sich die tägliche Arbeit der Schwestern erläutern. Beim Abschiede sprach Seine Königliche Hoheit dem ärztlichen Personal und den Pflegerinnen seinen Dank für ihren aufopfernden Dienst aus.</span>
<span class="news-columns">
<span><strong>Vom Wochenmarkte.</strong> Auf dem Marktplatze herrschte am Vormittag reges Leben. Aus den umliegenden Dörfern waren Händler mit Eiern, Butter und frischem Gemüse eingetroffen. Die Hausfrauen prüften die Waren mit Bedacht; vor den Blumenständen fanden sich bereits die ersten Frühlingsboten.<br><br><strong>Musik im Schloßgarten.</strong> Für den kommenden Sonntag ist bei günstiger Witterung ein kleines Nachmittagskonzert vorgesehen. Neben bekannten Märschen sollen auch heitere Walzer erklingen. Die Spaziergänger dürfen sich auf eine angenehme Stunde im Grünen freuen.</span>
<span><strong>Aus dem Eisenbahnverkehr.</strong> Am Bahnhofe werden die neuen Anschlagtafeln für den Sommerfahrplan vorbereitet. Reisende werden gebeten, die Abfahrtszeiten vor Antritt ihrer Fahrt nochmals zu prüfen. Für den Ausflugsverkehr nach Berlin erwartet man an den Feiertagen lebhaften Zuspruch.<br><br><strong>Aus der Nachbarschaft.</strong> In der Lesestube werden am Sonnabend neue Bücher ausgelegt. Ferner wird um die Rückgabe entliehener Bände gebeten. Der örtliche Gesangverein versammelt sich am Abend zu seiner wöchentlichen Probe.</span>
</span>
<span class="news-colophon">Literarische Rekonstruktion · Aus unserer Zeit.</span>
</span></template>
  <template id="letter-template"><span class="letter-sheet" lang="de"><span class="letter-date">Neustrelitz, im Frühling.</span><span class="letter-salutation">Meine liebe Freundin,</span><span>der Morgen liegt still über den Dächern, und vom Garten her zieht ein kühler Wind an mein Fenster. Ich habe die Zeitung neben Deinen letzten Brief gelegt und denke daran, wie viel ein einzelner Tag zu bewahren vermag.</span><span>Gestern führte mich mein Weg am Carolinenstift vorüber. Hinter den Fenstern begann schon früh die Arbeit. Auf dem Markte standen die ersten Blumen; eine ältere Dame trug weiße Handschuhe und blieb lange bei den Veilchen stehen.</span><span>Es sind die kleinen Dinge, die mir im Gedächtnis bleiben: das leise Schlagen einer Uhr, ein Licht im Zimmer, das Band zwischen den Seiten eines Buches. Ich möchte sie sammeln, ehe der Abend sie fortnimmt.</span><span>Schreibe mir bald. Bis dahin lege ich diesen Brief zu den anderen Erinnerungen.</span><span class="letter-signature">In treuer Verbundenheit.</span></span></template>
  <script>
    // 인트로는 페이지를 열 때마다 약 0.5초 보여준 뒤 사라집니다.
    const introScreen = document.getElementById('intro-screen');
    const mainPage = document.querySelector('.page');
    mainPage.inert = true;
    setTimeout(() => {
      document.body.classList.add('intro-leaving');
      setTimeout(() => {
        introScreen.hidden = true;
        mainPage.inert = false;
      }, 460);
    }, 500);
    // 오브제 좌표(%)와 크기, 기울기, 겹침 순서. images는 같은 폴더에 둡니다.
    const articleText = 'Seine Königliche Hoheit der Erbgroßherzog stattete gestern dem Carolinenstift einen Besuch ab. Unter Führung des leitenden Arztes besichtigte der hohe Gast die Krankensäle, die Küche und die Einrichtungen zur Pflege der Genesenden. Er erkundigte sich nach der Versorgung der Kranken und ließ sich die tägliche Arbeit der Schwestern erläutern. Beim Abschiede sprach Seine Königliche Hoheit dem ärztlichen Personal und den Pflegerinnen seinen Dank für ihren aufopfernden Dienst aus.';
    const objects = [
      {id:'letter',label:'인장이 찍힌 편지 봉투 — 나의 소개',image:'engraved-envelope.png',x:6,y:5,width:50,angle:-15,layer:3,category:'01 / A LETTER',title:'나를 소개합니다.',text:'봉투를 열면 펼쳐지는 나의 이야기.\n\n이곳에 원하는 소개글을 써주세요.'},
      {id:'candle',label:'촛대와 초 — 작은 생각',image:'engraved-candle.png',x:72,y:7,width:25,angle:8,layer:8,category:'02 / CANDLELIGHT',title:'촛불 곁의 생각.',text:'고요한 빛 아래에 남겨두고 싶은 문장들.\n\n이곳에 두 번째 글을 써주세요.'},
      {id:'paper',label:'Neustrelitzer Zeitung 신문 — 기록',kind:'newspaper',x:37,y:26,width:46,angle:-1,layer:5,category:'03 / NEUSTRELITZER ZEITUNG',title:'Der Erbgroßherzog im Carolinenstift.',text:articleText+'\n\n설정에 맞추어 작성한 창작 기사입니다. 이곳의 글은 원하는 내용으로 바꿀 수 있어요.'},
      {id:'gloves',label:'여성용 흰 장갑 — 비밀 서랍',image:'engraved-gloves.png',x:72,y:67,width:25,angle:-21,layer:10,category:'04 / A SECRET DRAWER',title:'작은 비밀 서랍.',text:'아직 이름을 붙이지 못한 생각과 작은 조각들.\n\n이곳에 네 번째 이야기를 담아주세요.'}
    ];
    const decorations = [
      {id:'ribbon',image:'engraved-ribbon.png',x:20,y:0,width:42,angle:33,layer:1},
      {id:'letter-sheet',kind:'letter-sheet',x:42,y:42,width:44,angle:10,layer:2},
      {id:'postcard',image:'engraved-postcard.png',x:3,y:52,width:42,angle:-9,layer:7},
      {id:'watch',image:'engraved-watch.png',x:23,y:76,width:23,angle:-8,layer:9},
      {id:'key',image:'engraved-key.png',x:4,y:30,width:11,angle:19,layer:9},
      {id:'pearls',image:'engraved-pearls.png',x:2,y:65,width:65,angle:-6,layer:20}
    ];
    const collage = document.getElementById('collage');
    const readingWindow = document.getElementById('reading-window');
    const windowTitle = document.getElementById('window-title');
    let selected = null;
    let returnFocus = null;
    function selectObject(object, button) {
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
      }
      selected = button;
      returnFocus = button;
      button.classList.add('is-selected');
      button.setAttribute('aria-expanded','true');
      document.getElementById('window-category').textContent = object.category;
      windowTitle.textContent = object.title;
      document.getElementById('window-copy').textContent = object.text;
      if (!readingWindow.open) readingWindow.showModal();
      document.querySelector('.window-body').scrollTop = 0;
      windowTitle.focus({preventScroll:true});
    }
    function placeItem(item, interactive) {
      const element = document.createElement(interactive ? 'button' : 'div');
      element.className = interactive ? 'object' : 'decoration';
      element.dataset.object = item.id;
      if (interactive) {
        element.type = 'button';
        element.setAttribute('aria-label',item.label);
        element.setAttribute('aria-controls','reading-window');
        element.setAttribute('aria-expanded','false');
      } else { element.setAttribute('aria-hidden','true'); }
      for (const [name,value] of Object.entries({x:item.x+'%',y:item.y+'%',width:item.width+'%',angle:item.angle+'deg',layer:item.layer})) element.style.setProperty('--'+name,value);
      if (item.kind) {
        element.classList.add('printed-object');
        const template = document.getElementById(item.kind === 'newspaper' ? 'newspaper-template' : 'letter-template');
        element.append(template.content.cloneNode(true));
      } else {
        element.style.setProperty('--image','url("'+item.image+'")');
        const image = document.createElement('img');
        image.src=item.image;
        image.alt='';
        image.draggable=false;
        element.append(image);
      }
      if (interactive) element.addEventListener('click',()=>selectObject(item,element));
      collage.append(element);
    }
    decorations.forEach(item=>placeItem(item,false));
    objects.forEach(item=>placeItem(item,true));
    // 창 바깥(투명한 배경)을 클릭하면 닫습니다. 창 안의 여백은 닫히지 않습니다.
    readingWindow.addEventListener('click',event=>{
      const bounds = readingWindow.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (event.target === readingWindow && outside) readingWindow.close();
    });
    document.getElementById('close-window').addEventListener('click',()=>readingWindow.close());
    readingWindow.addEventListener('close',()=>{
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
        selected = null;
      }
      if (returnFocus) returnFocus.focus({preventScroll:true});
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape' && readingWindow.open){event.preventDefault(); readingWindow.close();}
    });
  </script>
</body>
</html>
