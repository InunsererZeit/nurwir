<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네 개의 사물에 담아두는 이야기, In unserer Zeit">
  <title>In unserer Zeit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Playfair+Display:wght@400&amp;family=Roboto+Slab:wght@400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=square-ribbon-grey-7">
</head>
<body>
  <svg class="effect-definitions" aria-hidden="true" width="0" height="0"><defs><clipPath id="ribbon-front-clip" clipPathUnits="objectBoundingBox"><path d="M0 .4H.18V.62H.34V1H0Z M.78 .3H1V1H.78Z M.6 0H1V.37H.6Z"/></clipPath><filter id="logo-grain" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4" result="noise"><animate attributeName="seed" values="4;12;7;19" dur=".13s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feColorMatrix in="noise" type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in" result="grain"/><feBlend in="SourceGraphic" in2="grain" mode="screen"/></filter></defs></svg>
  <div class="intro-screen" id="intro-screen">
    <h1 class="intro-logo" aria-label="In unserer Zeit"><span aria-hidden="true">In</span><span aria-hidden="true">unserer</span><span aria-hidden="true">Zeit</span></h1>
  </div>
  <div class="page">
    <main aria-label="이야기가 담긴 사물들">
      <div class="collage" id="collage"><div class="watch-bubble" id="watch-bubble" role="status" hidden><span role="img" aria-label="모래시계">⏳</span></div></div>
    </main>
    <footer class="site-footer"><span>IN UNSERER ZEIT</span><span>© 2025</span></footer>
  </div>
  <dialog id="reading-window" aria-label="이야기" aria-describedby="window-copy">
    <button class="close" id="close-window" type="button" aria-label="글 창 닫기">×</button>
    <div class="window-body"><p class="copy" id="window-copy"></p></div>
  </dialog>
  <!-- Forward 2 Bold Duotone: Solar Icons by 480 Design, CC BY 4.0. See ATTRIBUTIONS.md. -->
  <template id="forward-icon-template"><svg class="solar-forward-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><title>Solar Icons · 480 Design · CC BY 4.0</title><g opacity=".5"><path d="M17.6893 12.75H9.5C8.54665 12.75 7.13332 12.4702 5.93677 11.6086C4.70198 10.7196 3.75 9.24444 3.75 7C3.75 6.58578 4.08579 6.25 4.5 6.25C4.91421 6.25 5.25 6.58578 5.25 7C5.25 8.75556 5.96468 9.7804 6.81323 10.3913C7.70002 11.0298 8.78668 11.25 9.5 11.25L17.6893 11.25L18.4393 12L17.6893 12.75Z" fill="currentColor"/><path d="M20.1931 12.2871C20.2298 12.1987 20.25 12.1017 20.25 12C20.25 12.0977 20.231 12.1954 20.1931 12.2871Z" fill="currentColor"/></g><path fill-rule="evenodd" clip-rule="evenodd" d="M13.9697 17.5303C14.2626 17.8232 14.7374 17.8232 15.0303 17.5303L20.0303 12.5303C20.3232 12.2374 20.3232 11.7626 20.0303 11.4697L15.0303 6.46967C14.7374 6.17678 14.2626 6.17678 13.9697 6.46967C13.6768 6.76256 13.6768 7.23744 13.9697 7.53033L18.4393 12L13.9697 16.4697C13.6768 16.7626 13.6768 17.2374 13.9697 17.5303Z" fill="currentColor"/></svg></template>
  <script>
    // 인트로는 페이지를 열 때마다 약 0.5초 보여준 뒤 사라집니다.
    const introScreen = document.getElementById('intro-screen');
    const mainPage = document.querySelector('.page');
    mainPage.inert = true;
    setTimeout(() => {
      document.body.classList.add('intro-leaving');
      setTimeout(() => {
        introScreen.hidden = true;
        mainPage.inert = false;
      }, 460);
    }, 500);
    // 오브제 좌표(%)와 크기, 기울기, 겹침 순서. images는 같은 폴더에 둡니다.
    const objects = [
      {id:'postcard',label:'노이슈트렐리츠 궁전 엽서',image:'palace-postcard-engraved.png',x:3,y:52,width:42,angle:-9,layer:7,text:"CP 드림 및 비윤리적 소재, 스포일러 포함\n민감한 성향의 분께선 열람에 유의해주세요"},
      {id:'letter',label:'인장이 찍힌 편지 봉투 — 나의 소개',image:'engraved-envelope-soft-seal.png',x:6,y:5,width:50,angle:-15,layer:3,text:"해수 @InunsererZeit\n20↑ 온리 반이입\n\n마법명가 차남으로 살아남는 법\n알버트 메클렌부르크 × 샤를로테 비텔스바흐\nAlbert Mecklenburg × Charlotte Wittelsbach"},
      {id:'paper',label:'Neustrelitzer Zeitung 신문 — 기록',image:'newspaper-folded-edges.png',x:33,y:24,width:56,angle:0,layer:5,text:"소수계 지향\n텍스트 위주, 비정기적 업로드\n\n기본 배려 반사, 편의상 1T1D 유지\n알고있는 장르 위주로 뵙고있어요"},
      {id:'gloves',label:'여성용 흰 장갑 — 비밀 서랍',image:'engraved-gloves.png',x:57.29296875,y:51.3955078125,width:36.9140625,angle:-21,layer:11,text:"NG\n타임라인 외부의 컨택\n대응할 여력이 부족합니다"}
    ];
    const decorations = [
      {id:'ribbon-back',label:'푸른 비단 리본',image:'blue-ribbon-square-ends.png',x:0,y:0,width:100,height:100,angle:0,layer:1,ribbon:true,colored:true},
      {id:'ribbon-front',label:'앞쪽으로 드리운 푸른 리본',image:'blue-ribbon-square-ends.png',x:0,y:0,width:100,height:100,angle:0,layer:8,ribbon:true,colored:true,front:true},
      {id:'candle',label:'촛대와 초',image:'engraved-candle.png',x:68,y:1,width:31.25,angle:8,layer:12,offsetX:-2,offsetY:33},
      {id:'letter-sheet',label:'신문 아래의 편지글',image:'engraved-letter-bright.png',x:42,y:42,width:44,angle:10,layer:2},
      {id:'watch',label:'회중시계 — 작은 비밀',action:'watch',image:'engraved-watch.png',x:19.78,y:70.952,width:29.44,angle:-18,layer:10,offsetX:20,offsetY:-20},
      {id:'key',label:'오래된 열쇠',image:'engraved-key.png',x:11,y:30,width:22,angle:27,layer:9},
    ];
    // 참고 이미지의 베이지색 점을 따라 낱알 진주를 배치합니다(중심 좌표 %).
    const pearlPositions=[
      [59.7,13.9,4.6],[58,16,4.8],[94.7,6.1,5.8],[5.4,19.2,4.6],
      [4.9,40.4,6],[96,42.5,4.8],[95.7,62,6],[93.4,64.2,4.2],
      [20.5,78.4,4.7],[23.6,81.1,3.5],[65.5,84.8,4.3],[68.9,88.8,5.4],
      [51.2,89.5,4.4],[11.6,90,5.7]
    ];
    pearlPositions.forEach(([x,y,width],index)=>decorations.push({
      id:'pearl-'+index,label:'진주 '+(index+1),image:'ivory-pearl.png',
      x:x-width/2,y:y-width*900/1100/2,width,angle:0,layer:13
    }));
    const collage = document.getElementById('collage');
    const elementsById=new Map();
    const markerByObject=new Map();
    const readingWindow = document.getElementById('reading-window');
    let selected = null;
    let dialogTrigger = null;
    function selectObject(object, button, trigger=button) {
      hideWatchBubble();
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
      }
      selected = button;
      dialogTrigger=trigger;
      const marker=markerByObject.get(object.id);
      if(marker)marker.setAttribute("aria-expanded","true");
      button.classList.add('is-selected');
      nudge(button);
      button.setAttribute('aria-expanded','true');
      const copy=document.getElementById('window-copy');
      copy.replaceChildren();
      object.text.split('\n').forEach((line,index)=>{
        if(index)copy.append(document.createTextNode('\n'));
        if(object.id==='letter'&&index===0&&line.startsWith('해수')){
          const name=document.createElement('strong');name.textContent='해수';
          copy.append(name,document.createTextNode(line.slice(2)));
        }else if((object.id==='letter'&&line==='마법명가 차남으로 살아남는 법')||(object.id==='gloves'&&line==='NG')){
          const strong=document.createElement('strong');strong.textContent=line;copy.append(strong);
        }else if(object.id==='gloves'&&index===2){
          const row=document.createElement('span');row.className='glove-note';
          row.append(document.getElementById('forward-icon-template').content.cloneNode(true));
          const text=document.createElement('span');text.className='glove-note-text';text.textContent=line;
          row.append(text);copy.append(row);
        }else if(object.id==='letter'&&line==='Albert Mecklenburg × Charlotte Wittelsbach'){
          const names=document.createElement('span');names.className='english-names';names.textContent=line;copy.append(names);
        }else{copy.append(document.createTextNode(line));}
      });
      if (!readingWindow.open) readingWindow.showModal();
      document.querySelector('.window-body').scrollTop = 0;
      document.getElementById('close-window').focus({preventScroll:true});
    }
    const watchBubble=document.getElementById('watch-bubble');
    let watchButton=null;
    function hideWatchBubble(){watchBubble.hidden=true;if(watchButton)watchButton.setAttribute('aria-expanded','false');}
    const nudgeTimers=new WeakMap();
    function nudge(element){
      clearTimeout(nudgeTimers.get(element));
      element.classList.remove('is-nudging');
      void element.offsetWidth;
      element.classList.add('is-nudging');
      nudgeTimers.set(element,setTimeout(()=>element.classList.remove('is-nudging'),700));
    }
    function positionWatchBubble(){
      if(watchBubble.hidden||!watchButton)return;
      const board=collage.getBoundingClientRect(),anchor=watchButton.getBoundingClientRect();
      const left=Math.max(8-board.left,anchor.left-board.left-watchBubble.offsetWidth-10)+15;
      const top=Math.max(8,anchor.top-board.top+anchor.height/2-watchBubble.offsetHeight/2)+15;
      watchBubble.style.left=left+'px';watchBubble.style.top=top+'px';
    }
    window.addEventListener('resize',positionWatchBubble);
    function activate(item,element){
      if(item.ribbon)return;
      if(item.popup){selectObject(item,element);return;}
      nudge(element);
      if(item.action==='watch'){
        const show=watchBubble.hidden;
        hideWatchBubble();
        watchBubble.hidden=!show;
        if(show)positionWatchBubble();
        element.setAttribute('aria-expanded',String(show));
      }else{hideWatchBubble();}
    }
    const itemByElement=new Map();
    function placeItem(item,popup){
      item.popup=popup;
      const element=document.createElement(item.ribbon?'div':'button');
      if(!item.ribbon)element.type='button';
      element.className='object';
      element.dataset.object=item.id;
      if(item.id==='postcard')element.classList.add('photo-postcard');
      if(item.colored)element.classList.add('colored-object');
      if(item.ribbon){element.classList.add('ribbon-object');element.setAttribute('aria-hidden','true');}
      if(item.front)element.classList.add('ribbon-front');
      if(item.height)element.style.height=item.height+'%';
      if(!item.ribbon)element.setAttribute('aria-label',item.label);
      if(popup){element.setAttribute('aria-controls','reading-window');element.setAttribute('aria-expanded','false');}
      if(item.action==='watch'){watchButton=element;element.setAttribute('aria-controls','watch-bubble');element.setAttribute('aria-expanded','false');}
      for(const [name,value] of Object.entries({x:item.x+'%',y:item.y+'%',width:item.width+'%',angle:item.angle+'deg',layer:item.layer,'offset-x':(item.offsetX||0)+'px','offset-y':(item.offsetY||0)+'px'}))element.style.setProperty('--'+name,value);
      element.style.setProperty('--image','url("'+item.image+'")');
      const image=document.createElement('img');image.src=item.image;image.alt='';image.draggable=false;element.append(image);
      itemByElement.set(element,item);
      elementsById.set(item.id,element);
      collage.append(element);
    }
    decorations.forEach(item=>placeItem(item,false));
    objects.forEach(item=>placeItem(item,true));
    const numberedObjects=[
      {id:'letter',number:1,x:11.8,y:7.6,label:'편지'},
      {id:'paper',number:2,x:27.9,y:28.3,label:'신문'},
      {id:'postcard',number:3,x:3.1,y:51.2,label:'사진 엽서'},
      {id:'gloves',number:4,x:86.9,y:56.2,label:'장갑'}
    ];
    numberedObjects.forEach(({id,number,x,y,label})=>{
      const marker=document.createElement('button');
      marker.type='button';marker.className='number-marker';marker.dataset.opens=id;
      marker.textContent=number;marker.style.left=x+'%';marker.style.top=y+'%';
      marker.setAttribute('aria-label',number+'. '+label+' 글 열기');
      marker.setAttribute('aria-controls','reading-window');marker.setAttribute('aria-expanded','false');
      markerByObject.set(id,marker);collage.append(marker);
    });
    // 투명 여백을 제외한 하단을 기준으로 푸터를 배치합니다.
    // 장갑은 크기 변경 전의 기준 폭(32.8125%)을 사용해 푸터 위치를 유지합니다.
    const footerInkEdges=new WeakMap();
    function visibleBottom(element,visualScale=1){
      const img=element.querySelector("img");
      if(!img||element.classList.contains("photo-postcard")||!img.complete||!img.naturalWidth)return element.getBoundingClientRect().bottom;
      try{
        let edges=footerInkEdges.get(img);
        if(!edges){
          const cv=document.createElement("canvas");cv.width=img.naturalWidth;cv.height=img.naturalHeight;
          const ctx=cv.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0);
          const pixels=ctx.getImageData(0,0,cv.width,cv.height).data;edges=[];
          for(let y=0;y<cv.height;y+=2){
            let left=0,right=cv.width-1;
            while(left<cv.width&&pixels[(y*cv.width+left)*4+3]<40)left++;
            while(right>=left&&pixels[(y*cv.width+right)*4+3]<40)right--;
            if(left<=right)edges.push([left/cv.width,y/cv.height],[right/cv.width,y/cv.height]);
          }
          footerInkEdges.set(img,edges);
        }
        const style=getComputedStyle(element),m=new DOMMatrix(style.transform),origin=style.transformOrigin.split(" ").map(parseFloat);
        const top=collage.getBoundingClientRect().top+element.offsetTop+origin[1];
        return top+Math.max(...edges.map(([x,y])=>visualScale*(m.b*(x*element.offsetWidth-origin[0])+m.d*(y*element.offsetHeight-origin[1]))+m.f));
      }catch{return element.getBoundingClientRect().bottom;}
    }
    function positionFooter(){
      const footer=document.querySelector('.site-footer');
      footer.style.translate='none';
      const bottom=Math.max(...[...collage.querySelectorAll('.object:not(.ribbon-object)')].map(e=>visibleBottom(e,e.dataset.object==='gloves'?1/1.125:1)));
      footer.style.translate='0 '+(bottom+49-footer.firstElementChild.getBoundingClientRect().top)+'px';
    }
    window.addEventListener('resize',positionFooter);
    window.addEventListener('load',positionFooter);
    document.fonts.ready.then(positionFooter);
    positionFooter();
    // 투명 이미지의 빈 부분은 아래에 있는 사물을 선택하도록 통과시킵니다.
    const alphaCanvases=new WeakMap();
    function hitsInk(element,event){
      const img=element.querySelector('img');
      if(!img||!img.complete||!img.naturalWidth)return true;
      try{
        const style=getComputedStyle(element),origin=style.transformOrigin.split(' ').map(parseFloat),board=collage.getBoundingClientRect();
        const point=new DOMPoint(event.clientX-board.left-element.offsetLeft-origin[0],event.clientY-board.top-element.offsetTop-origin[1]);
        const local=new DOMMatrix(style.transform).inverse().transformPoint(point);
        const x=local.x+origin[0],y=local.y+origin[1];
        if(x<0||y<0||x>=element.offsetWidth||y>=element.offsetHeight)return false;
        let canvas=alphaCanvases.get(img);
        if(!canvas){canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0);alphaCanvases.set(img,canvas);}
        return canvas.getContext('2d').getImageData(Math.floor((x-img.offsetLeft)/img.offsetWidth*canvas.width),Math.floor((y-img.offsetTop)/img.offsetHeight*canvas.height),1,1).data[3]>24;
      }catch{return true;}
    }
    collage.addEventListener('click',event=>{
      if(event.target.closest('.watch-bubble'))return;
      const marker=event.target.closest('.number-marker');
      if(marker){
        const item=objects.find(object=>object.id===marker.dataset.opens);
        selectObject(item,elementsById.get(item.id),marker);return;
      }
      let target=null;
      if(event.detail===0){target=event.target.closest('.object');}
      else{
        const candidates=[...new Set(document.elementsFromPoint(event.clientX,event.clientY).map(e=>e.closest('.object')).filter(e=>e&&collage.contains(e)))];
        target=candidates.find(element=>hitsInk(element,event));
      }
      if(target&&itemByElement.has(target)){
        const item=itemByElement.get(target);
        if(item.ribbon)return;
        activate(item,target);
      }
      else hideWatchBubble();
    });
    document.addEventListener('click',event=>{if(!collage.contains(event.target))hideWatchBubble();});
    // 창 바깥(투명한 배경)을 클릭하면 닫습니다. 창 안의 여백은 닫히지 않습니다.
    readingWindow.addEventListener('click',event=>{
      const bounds = readingWindow.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (event.target === readingWindow && outside) readingWindow.close();
    });
    document.getElementById('close-window').addEventListener('click',()=>readingWindow.close());
    readingWindow.addEventListener('close',()=>{
      const focusTarget=dialogTrigger||selected;
      dialogTrigger=null;
      markerByObject.forEach(marker=>marker.setAttribute("aria-expanded","false"));
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
        selected = null;
      }
      if (focusTarget) focusTarget.focus({preventScroll:true});
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){hideWatchBubble();if(readingWindow.open){event.preventDefault();readingWindow.close();}}
    });
  </script>
</body>
</html>
