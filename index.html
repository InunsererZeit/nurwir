<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네 개의 사물에 담아두는 이야기, In unserer Zeit">
  <title>In unserer Zeit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Playfair+Display:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=collage-intro-3">
</head>
<body>
  <div class="intro-screen" id="intro-screen">
    <h1 class="intro-logo" aria-label="In unserer Zeit"><span aria-hidden="true">In</span><span aria-hidden="true">unserer</span><span aria-hidden="true">Zeit</span></h1>
  </div>
  <div class="page">
    <main aria-label="이야기가 담긴 네 개의 사물">
      <div class="collage" id="collage"></div>
      <p class="hint">오브제를 눌러 확인하세요.</p>
    </main>
  </div>
  <dialog id="reading-window" aria-labelledby="window-title" aria-describedby="window-copy">
    <div class="window-bar"><span id="window-category">a little story</span><button class="close" id="close-window" type="button" aria-label="글 창 닫기">×</button></div>
    <div class="window-body"><h2 id="window-title" tabindex="-1"></h2><p class="copy" id="window-copy"></p><p class="sample">예시 글 · 나만의 이야기로 바꿔주세요.</p></div>
  </dialog>
  <script>
    // 인트로는 페이지를 열 때마다 약 0.75초 보여준 뒤 사라집니다.
    const introScreen = document.getElementById('intro-screen');
    const mainPage = document.querySelector('.page');
    mainPage.inert = true;
    setTimeout(() => {
      document.body.classList.add('intro-leaving');
      setTimeout(() => {
        introScreen.hidden = true;
        mainPage.inert = false;
      }, 460);
    }, 750);
    // 교체 안내: image는 이미지 파일 경로입니다. 투명 PNG/SVG를 권장합니다.
    // x, y, width는 캔버스 기준 %, angle은 기울기(도), layer는 겹치는 순서입니다.
    // title과 text를 바꾸면 창 안의 글이 바뀝니다. text 안의 \n은 줄바꿈입니다.
    const objects = [
      { id:'letter', label:'편지 봉투 — 나의 소개', image:'object-letter.svg',
        x:7, y:5, width:64, angle:-8, layer:1,
        category:'01 / A LETTER', title:'나를 소개합니다.',
        text:'안녕하세요. 이곳은 나의 이야기를 담아두는 작은 공간입니다.\n\n편지 한 장을 펼치듯, 나에 대한 이야기를 천천히 적어보려고 해요.\n\n여기에 원하는 소개글을 써주세요.' },
      { id:'paper', label:'신문 — 짧은 기록', image:'object-paper.svg',
        x:39, y:19, width:51, angle:5, layer:2,
        category:'02 / LITTLE NOTES', title:'기억하고 싶은 순간.',
        text:'어떤 날은 한 문장만으로도 오래 기억됩니다.\n\n오늘의 생각, 잊고 싶지 않은 장면, 우연히 발견한 문장을 모아두는 곳.\n\n이곳에 나만의 기록을 남겨보세요.' },
      { id:'postcard', label:'백조 엽서 — 좋아하는 것들', image:'object-postcard.svg',
        x:4, y:47, width:65, angle:-7, layer:3,
        category:'03 / THINGS I LOVE', title:'좋아하는 것들.',
        text:'오래된 종이의 결, 흑백 사진, 마음에 남는 이야기.\n\n사소하지만 하루를 조금 더 좋게 만들어주는 것들이 있어요.\n\n여기에 좋아하는 것들을 하나씩 모아주세요.' },
      { id:'charm', label:'하트 장신구 — 비밀 서랍', image:'object-charm.svg',
        x:70, y:68, width:25, angle:12, layer:4,
        category:'04 / A SECRET DRAWER', title:'작은 비밀 서랍.',
        text:'아직 이름을 붙이지 못한 생각과 작은 조각들.\n\n이곳은 네 번째 이야기를 위한 자리입니다.\n\n원하는 주제의 글로 자유롭게 바꿔주세요.' }
    ];
    const collage = document.getElementById('collage');
    const readingWindow = document.getElementById('reading-window');
    const windowTitle = document.getElementById('window-title');
    let selected = null;
    let returnFocus = null;
    function selectObject(object, button) {
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
      }
      selected = button;
      returnFocus = button;
      button.classList.add('is-selected');
      button.setAttribute('aria-expanded','true');
      document.getElementById('window-category').textContent = object.category;
      windowTitle.textContent = object.title;
      document.getElementById('window-copy').textContent = object.text;
      if (!readingWindow.open) readingWindow.show();
      document.querySelector('.window-body').scrollTop = 0;
      windowTitle.focus({preventScroll:true});
    }
    objects.forEach(object => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'object';
      button.dataset.object = object.id;
      button.setAttribute('aria-label',object.label);
      button.setAttribute('aria-controls','reading-window');
      button.setAttribute('aria-expanded','false');
      button.style.setProperty('--x',object.x+'%');
      button.style.setProperty('--y',object.y+'%');
      button.style.setProperty('--width',object.width+'%');
      button.style.setProperty('--angle',object.angle+'deg');
      button.style.setProperty('--layer',object.layer);
      button.style.setProperty('--image','url("'+object.image+'")');
      const image = document.createElement('img');
      image.src = object.image;
      image.alt = '';
      image.draggable = false;
      button.append(image);
      button.addEventListener('click',()=>selectObject(object,button));
      collage.append(button);
    });
    document.getElementById('close-window').addEventListener('click',()=>readingWindow.close());
    readingWindow.addEventListener('close',()=>{
      if (selected) {
        selected.classList.remove('is-selected');
        selected.setAttribute('aria-expanded','false');
        selected = null;
      }
      if (returnFocus) returnFocus.focus({preventScroll:true});
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape' && readingWindow.open){event.preventDefault(); readingWindow.close();}
    });
  </script>
</body>
</html>
