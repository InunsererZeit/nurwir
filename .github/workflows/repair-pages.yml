name: Repair stalled Pages deployment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deployment=37c75b4afab5f3499f78f47ed69f59cf339ab9df
          endpoint="https://api.github.com/repos/$GH_REPOSITORY/pages/deployments/$deployment"
          status_code=$(curl --silent --show-error --output status.json --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$endpoint")
          echo "Pages status HTTP $status_code"
          cat status.json
          echo
          cancel_code=$(curl --silent --show-error --request POST --output cancel.json --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$endpoint/cancel")
          echo "Cancel HTTP $cancel_code"
          cat cancel.json
          echo
          if [ "$cancel_code" != '204' ]; then
            echo 'The Pages cancellation request was not accepted.'
            exit 1
          fi
          echo 'Stalled Pages deployment cancellation accepted.'
