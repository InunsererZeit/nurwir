name: Clean unused site files
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cleanup-site.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clean site files in one commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          import urllib.error
          
          repository = os.environ["GH_REPOSITORY"]
          if repository != "InunsererZeit/nurwir":
              raise RuntimeError("Unexpected repository")
          payload = json.loads(r'''{"keep":["index.html","style.css","ATTRIBUTIONS.md","opening-logo.png","palace-postcard-hatched.png","envelope-light-paper-dark-wax.png","newspaper-etched-light.png","gloves-right-thumb.png","blue-ribbon-fine-hatch.png","engraved-candle.png","letter-charlotte-cursive.png","engraved-watch.png","engraved-key-rococo.png","ivory-pearl.png"],"remove":["ARTICLES.de.txt","ARTWORK-PROMPTS.md","blue-ribbon-contour-v2.png","blue-ribbon-flow.png","blue-ribbon-matte.png","blue-ribbon-shaped.png","blue-ribbon-soft-edges.png","blue-ribbon-square-ends.png","blue-ribbon.png","bold-name-preview.jpg","candle-left-15-preview.jpg","candle-right-preview.jpg","cleaned-code-preview.jpg","collage-preview.jpg","compact-watch-preview.jpg","copy-emphasis-preview.jpg","dialog-copy-update-preview.jpg","EDITING.md","emoji-watch-preview.jpg","engraved-envelope-hatched.png","engraved-envelope-soft-seal.png","engraved-envelope-v2.png","engraved-envelope.png","engraved-gloves.png","engraved-key.png","engraved-letter-bright.png","engraved-letter-hatched.png","engraved-letter-sheet.png","engraved-pearls.png","engraved-postcard.png","engraved-ribbon.png","engraved-scene-preview.jpg","envelope-introduction-preview.jpg","envelope-round-wax.png","fixed-candle-mobile-preview.jpg","footer-candle-adjustment-preview.jpg","footer-inset-preview.jpg","gentle-motion-preview.jpg","glass-dialog-preview.jpg","glass-glow-preview.jpg","gloves-restored-thumb.png","grain-refinement-preview.jpg","illustrated-desktop-preview.jpg","illustrated-mobile-preview.jpg","IMAGE-PROMPTS.md","intro-main-preview.jpg","intro-preview.jpg","large-newspaper-preview.jpg","letter-charlotte-ko.png","newspaper-engraved.png","newspaper-fold-margins.png","newspaper-folded-edges.png","newspaper-hatched-sheet.png","newspaper-revision-preview.jpg","newspaper-soft-fold-text.png","newspaper-text-ads.png","object-charm.svg","object-letter.svg","object-paper.svg","object-postcard.svg","opening-075-preview.jpg","palace-layout-preview.jpg","palace-postcard-engraved.png","palace-postcard.png","playfair-preview.jpg","postcard-dialog-preview.jpg","preview.jpg","refined-popup-preview.jpg","restored-paper-preview.jpg","roboto-slab-preview.jpg","short-intro-main.jpg","short-intro-preview.jpg","solar-glove-preview.jpg","title-free-window-preview.jpg","UPDATE-23.md","watch-easter-egg-preview.jpg"],"files":{"index.html":"","style.css":"","ATTRIBUTIONS.md":""}}''')
          token = os.environ["GH_TOKEN"]
          api_root = "https://api.github.com/repos/" + repository
          
          def api(method, endpoint, body=None):
              request = urllib.request.Request(
                  api_root + endpoint,
                  data=None if body is None else json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "nurwir-site-cleanup"
                  },
                  method=method
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print("GitHub API error:", error.code, error.read().decode("utf-8"))
                  raise
          
          head = api("GET", "/git/ref/heads/main")["object"]["sha"]
          commit = api("GET", "/git/commits/" + head)
          expected_parent = "6d2229b8da25b1eab5aeec41c711b3897cf6c906"
          if not commit["parents"] or commit["parents"][0]["sha"] != expected_parent:
              raise RuntimeError("Main changed since cleanup was prepared; no files were changed")
          base_tree = commit["tree"]["sha"]
          tree = api("GET", "/git/trees/" + base_tree + "?recursive=1")
          if tree.get("truncated"):
              raise RuntimeError("Incomplete repository tree")
          root_files = {item["path"]: item for item in tree["tree"] if item["type"] == "blob" and "/" not in item["path"]}
          missing = set(payload["keep"]) - set(root_files)
          unexpected = set(root_files) - set(payload["keep"]) - set(payload["remove"])
          if missing or unexpected:
              raise RuntimeError("Unexpected file inventory: missing=" + repr(missing) + ", extra=" + repr(unexpected))
          changes = []
          removed = []
          removed_bytes = 0
          for name in payload["remove"]:
              if name not in root_files:
                  continue
              item = root_files[name]
              changes.append({"path": name, "mode": item["mode"], "type": "blob", "sha": None})
              removed.append(name)
              removed_bytes += item.get("size", 0)
          for name, encoded in payload["files"].items():
              if name not in ("index.html", "style.css", "ATTRIBUTIONS.md"):
                  raise RuntimeError("Unexpected update path")
              content = base64.b64decode(encoded, validate=True).decode("utf-8")
              changes.append({"path": name, "mode": "100644", "type": "blob", "content": content})
          new_tree = api("POST", "/git/trees", {"base_tree": base_tree, "tree": changes})["sha"]
          new_commit = api("POST", "/git/commits", {
              "message": "Simplify labels and remove unused site assets",
              "tree": new_tree,
              "parents": [head]
          })["sha"]
          api("PATCH", "/git/refs/heads/main", {"sha": new_commit, "force": False})
          print("Cleanup commit:", new_commit)
          print("Removed root files:", len(removed))
          print("Removed bytes:", removed_bytes)
          for name in removed:
              print("Removed:", name)
          print("Kept root files:", len(payload["keep"]))
          PY
